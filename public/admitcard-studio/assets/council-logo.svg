<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Circular text paths -->
    <path id="crestCircleTop" d="M 100,100 m -74,0 a 74,74 0 1,1 148,0" />
    <path id="crestCircleBottom" d="M 100,100 m 74,0 a 74,74 0 1,1 -148,0" />
    
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5296"/>
      <stop offset="100%" stop-color="#0c2d59"/>
    </linearGradient>
    <radialGradient id="shieldBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2f9"/>
    </radialGradient>
  </defs>

  <!-- Outer Ring with Decorative Notches -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#0f3460" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="100" cy="100" r="77" fill="url(#blueGradient)" stroke="#0f3460" stroke-width="1.5"/>

  <!-- Rim text -->
  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="7" font-weight="bold" fill="#ffffff" letter-spacing="1">
    <textPath href="#crestCircleTop" startOffset="50%" text-anchor="middle">
      ALL INDIA COUNCIL FOR VOCATIONAL
    </textPath>
  </text>
  <text font-family="'Cinzel', 'Times New Roman', serif" font-size="6.8" font-weight="bold" fill="#fdf0cd" letter-spacing="1.1">
    <textPath href="#crestCircleBottom" startOffset="50%" text-anchor="middle">
      ★ &amp; PARAMEDICAL SCIENCE ★
    </textPath>
  </text>

  <!-- Inner Golden Ring -->
  <circle cx="100" cy="100" r="60" fill="url(#shieldBg)" stroke="#d4af37" stroke-width="2.5"/>

  <!-- Laurel Wreath (Left & Right) -->
  <g fill="#2e7d32" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M 48,100 C 46,92 51,84 57,78 C 55,83 55,89 58,94 Z"/>
    <path d="M 52,80 C 51,72 58,66 65,63 C 62,68 62,74 64,80 Z"/>
    <path d="M 60,65 C 62,58 70,54 78,54 C 74,58 73,65 74,70 Z"/>
    <path d="M 48,102 C 46,110 51,118 57,124 C 55,119 55,113 58,108 Z"/>
    <path d="M 52,122 C 51,130 58,136 65,139 C 62,134 62,128 64,122 Z"/>
    <path d="M 60,137 C 62,144 70,148 78,148 C 74,144 73,137 74,132 Z"/>

    <!-- Right Leaves -->
    <path d="M 152,100 C 154,92 149,84 143,78 C 145,83 145,89 142,94 Z"/>
    <path d="M 148,80 C 149,72 142,66 135,63 C 138,68 138,74 136,80 Z"/>
    <path d="M 140,65 C 138,58 130,54 122,54 C 126,58 127,65 126,70 Z"/>
    <path d="M 152,102 C 154,110 149,118 143,124 C 145,119 145,113 142,108 Z"/>
    <path d="M 148,122 C 149,130 142,136 135,139 C 138,134 138,128 136,122 Z"/>
    <path d="M 140,137 C 138,144 130,148 122,148 C 126,144 127,137 126,132 Z"/>
  </g>

  <!-- Central Crest Shield -->
  <g transform="translate(100, 96)">
    <!-- Shield Outline -->
    <path d="M -26,-30 L 26,-30 C 26,-30 28,0 24,12 C 18,26 0,36 0,36 C 0,36 -18,26 -24,12 C -28,0 -26,-30 -26,-30 Z"
          fill="#ffffff" stroke="#0f3460" stroke-width="1.8"/>

    <!-- Shield Quadrants -->
    <!-- Top-Left: Medical Caduceus / Cross (Green background) -->
    <path d="M -24,-28 L 0,-28 L 0,0 L -24,0 C -25,-10 -25,-20 -24,-28 Z" fill="#2d6a4f" />
    <!-- Top-Right: Vocational Gear & Book (Navy background) -->
    <path d="M 0,-28 L 24,-28 C 25,-20 25,-10 24,0 L 0,0 Z" fill="#1e40af" />
    <!-- Bottom-Left: Golden Knowledge Lamp (Gold/Amber background) -->
    <path d="M -24,0 L 0,0 L 0,26 C -8,22 -17,14 -22,2 C -23,1 -24,0 -24,0 Z" fill="#d97706" />
    <!-- Bottom-Right: Paramedical Staff / Leaf (Teal/Royal background) -->
    <path d="M 0,0 L 24,0 C 24,0 23,1 22,2 C 17,14 8,22 0,26 Z" fill="#0284c7" />

    <!-- Shield Inner Division Lines -->
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#d4af37" stroke-width="1.5"/>

    <!-- Symbols inside quadrants -->
    <!-- 1. Red / White Medical Cross in Top Left -->
    <path d="M -15,-18 H -9 V -22 H -5 V -18 H 1 V -14 H -5 V -10 H -9 V -14 H -15 Z" fill="#ffffff" transform="translate(-2, 3) scale(0.65)"/>
    
    <!-- 2. Open Book in Top Right -->
    <path d="M 7,-16 C 9,-18 13,-18 16,-17 L 16,-9 C 13,-10 9,-10 7,-8 Z M 6,-16 C 4,-18 0,-18 -3,-17 L -3,-9 C 0,-10 4,-10 6,-8 Z"
          fill="#ffffff" transform="translate(6, 1) scale(0.7)"/>

    <!-- 3. Knowledge Lamp in Bottom Left -->
    <path d="M -16,10 C -12,8 -8,11 -6,13 L -14,13 Z M -8,9 C -7,7 -9,6 -9,6 C -9,6 -11,8 -10,9 Z"
          fill="#ffffff" transform="translate(-1, 0) scale(0.9)"/>

    <!-- 4. Caduceus / Star in Bottom Right -->
    <circle cx="12" cy="11" r="4" fill="#ffffff"/>
    <path d="M 12,5 L 12,17 M 8,11 L 16,11" stroke="#0284c7" stroke-width="1.2"/>
  </g>

  <!-- Bottom Ribbon / Banner: AICVPS -->
  <g transform="translate(100, 142)">
    <path d="M -36,-7 L -44,-14 L -40,-3 L -46,6 L -34,3 L 34,3 L 46,6 L 40,-3 L 44,-14 L 36,-7 Z" fill="#0c2d59"/>
    <path d="M -36,-7 L 36,-7 C 38,-7 40,-5 40,-3 L 36,5 C 36,6 34,7 32,7 L -32,7 C -34,7 -36,6 -36,5 L -40,-3 C -40,-5 -38,-7 -36,-7 Z"
          fill="url(#blueGradient)" stroke="#d4af37" stroke-width="1.2"/>
    <text x="0" y="3" font-family="'Cinzel', 'Arial', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      AICVPS
    </text>
  </g>
</svg>
