<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Text Paths for top and bottom of circle -->
    <path id="stampTopPath" d="M 120,120 m -84,0 a 84,84 0 1,1 168,0" />
    <path id="stampBottomPath" d="M 120,120 m 84,0 a 84,84 0 1,1 -168,0" />
  </defs>

  <!-- Outer Double Circle with Stamp Texture -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="#163e75" stroke-width="2.8"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#163e75" stroke-width="1.2" stroke-dasharray="3,2"/>
  
  <!-- Inner Framing Ring -->
  <circle cx="120" cy="120" r="72" fill="none" stroke="#163e75" stroke-width="1.8"/>
  <circle cx="120" cy="120" r="68" fill="none" stroke="#163e75" stroke-width="0.8"/>

  <!-- Stamp Text -->
  <text font-family="'Inter', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#163e75" letter-spacing="1">
    <textPath href="#stampTopPath" startOffset="50%" text-anchor="middle">
      All India Council For
    </textPath>
  </text>
  <text font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="800" fill="#163e75" letter-spacing="0.8">
    <textPath href="#stampBottomPath" startOffset="50%" text-anchor="middle">
      ★ Vocational and Paramedical Science ★
    </textPath>
  </text>

  <!-- Signature Overlay inside the Stamp -->
  <g stroke="#163e75" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(16, 12)">
    <!-- Fluid handwritten signature matching the reference photo -->
    <path d="M 60,118 C 65,95 72,82 82,78 C 90,75 94,84 86,102 C 78,118 68,124 60,122 C 54,120 58,106 70,96 C 82,86 98,90 106,100 C 114,110 125,116 136,112 C 145,108 148,96 156,92 C 164,88 172,98 178,100" />
    <path d="M 48,108 C 72,105 115,107 175,107" stroke-width="2"/>
    <circle cx="82" cy="78" r="1.5" fill="#163e75"/>
  </g>
</svg>
